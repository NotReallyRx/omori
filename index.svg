<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:iframe id="frame" style="width:100%;height:100%;border:0;" />
  </foreignObject>

  <script><![CDATA[
    var URL_ = "./index.html";
    var frame = document.getElementById("frame");

    function showError(message) {
      frame.srcdoc =
        "<!doctype html><html><body style='margin:0;padding:24px;" +
        "font:14px system-ui;color:#b00;background:#fff'>" +
        "<pre style='white-space:pre-wrap'>" +
        String(message).replace(/&/g,"&amp;").replace(/</g,"&lt;") +
        "</pre></body></html>";
    }

    fetch(new URL(URL_, document.baseURI).href, {
      credentials: "same-origin"
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status + " while loading " + URL_);
        }
        return response.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var base = doc.createElement("base");
        base.href = new URL("./", new URL(URL_, document.baseURI)).href;

        if (doc.head) {
          doc.head.insertBefore(base, doc.head.firstChild);
        } else {
          var head = doc.createElement("head");
          head.appendChild(base);
          doc.documentElement.insertBefore(head, doc.body || null);
        }

        frame.srcdoc = "<!doctype html>" + doc.documentElement.outerHTML;
      })
      .catch(showError);
  ]]></script>
</svg>
